<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#F4E9D8}
.cover{position:relative;width:1080px;height:1920px;background:url('assets/mascot/breakfast-cover-v1.png') center/cover no-repeat}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(34,48,74,.055) .7px,transparent .7px);background-size:5px 5px;opacity:.5;pointer-events:none}
.top{position:absolute;left:0;top:0;width:1080px;height:650px;background:#F4E9D8;padding:54px 74px 0;box-shadow:0 10px 0 rgba(34,48,74,.08)}
.kicker{font:600 27px/1.2 "Microsoft YaHei",sans-serif;letter-spacing:.18em;color:#7A8B7F}
.title{font:900 132px/0.95 "Microsoft YaHei",sans-serif;letter-spacing:-.055em;color:#22304A;margin-top:22px}
.title .red{color:#C95845}
.sub{font:700 55px/1.2 "Microsoft YaHei",sans-serif;color:#22304A;margin-top:18px;letter-spacing:.02em}
.en{font:600 25px/1.2 Georgia,serif;letter-spacing:.16em;color:#6B6257;margin-top:18px}
.rule{position:absolute;left:74px;bottom:0;width:932px;height:6px;background:#C95845}
.sticker{position:absolute;right:64px;top:735px;width:220px;height:220px;border-radius:50%;background:#C95845;color:#FFF9EF;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-9deg);box-shadow:0 12px 0 rgba(34,48,74,.18);border:6px solid #F4E9D8}
.sticker b{font:900 84px/0.9 Georgia,serif;letter-spacing:-.05em}
.sticker span{font:700 18px/1.2 "Microsoft YaHei",sans-serif;letter-spacing:.08em;margin-top:8px}
.bottom{position:absolute;left:64px;bottom:54px;font:700 30px/1.2 "Microsoft YaHei",sans-serif;letter-spacing:.12em;color:#22304A;background:rgba(244,233,216,.9);padding:14px 20px;border-left:8px solid #7A8B7F}
.tag{position:absolute;right:20px;top:950px;width:270px;height:100px;background:#F4E9D8;border:5px solid #22304A;box-shadow:0 8px 0 rgba(34,48,74,.18);transform:rotate(-4deg);display:flex;align-items:center;justify-content:center;font:800 30px/1 "Microsoft YaHei",sans-serif;letter-spacing:.08em;color:#22304A}
.tag span{color:#C95845;margin-left:8px}
</style></head><body>
<div class="cover">
  <div class="grain"></div>
  <div class="top">
    <div class="kicker">SINOFIELDNOTES · EP.05</div>
    <div class="title"><span class="red">5 个词</span>，<br>60 秒</div>
    <div class="sub">在早餐摊开口说中文</div>
    <div class="en">ORDER BREAKFAST IN CHINESE</div>
    <div class="rule"></div>
  </div>
  <div class="sticker"><b>05</b><span>BREAKFAST</span></div>
  <div class="tag">MOMO</div>
  <div class="bottom">MOMO / 早餐点单</div>
</div>
</body></html>
