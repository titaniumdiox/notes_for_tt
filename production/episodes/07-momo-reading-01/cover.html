<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#E8E6DF}
.cover{position:relative;width:1080px;height:1920px;background:url('assets/mascot/reading-cover-v1.png') center/cover no-repeat}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(43,52,64,.05) .7px,transparent .7px);background-size:5px 5px;opacity:.45;pointer-events:none}
.top{position:absolute;left:0;top:0;width:1080px;height:650px;background:#E8E6DF;padding:52px 74px 0;box-shadow:0 10px 0 rgba(43,52,64,.07)}
.kicker{font:600 27px/1.2 Georgia,serif;letter-spacing:.18em;color:#7C8FA3}
.title{font:900 70px/1.0 Georgia,serif;letter-spacing:-.03em;color:#2B3440;margin-top:22px}
.title .red{color:#B85C4A}
.sub{font:700 38px/1.2 "Microsoft YaHei",sans-serif;color:#2B3440;margin-top:16px;letter-spacing:.02em}
.poem{font:600 30px/1.2 "Microsoft YaHei",sans-serif;color:#7C8FA3;margin-top:10px}
.en{font:600 22px/1.3 Georgia,serif;letter-spacing:.12em;color:#6B6257;margin-top:12px;font-style:italic}
.rule{position:absolute;left:74px;bottom:0;width:932px;height:6px;background:#B85C4A}
.sticker{position:absolute;right:64px;top:735px;width:220px;height:220px;border-radius:50%;background:#B85C4A;color:#FFF9EF;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);box-shadow:0 12px 0 rgba(43,52,64,.18);border:6px solid #E8E6DF}
.sticker b{font:900 82px/0.9 Georgia,serif;letter-spacing:-.05em}
.sticker span{font:700 18px/1.2 Arial,sans-serif;letter-spacing:.12em;margin-top:8px}
.bottom{position:absolute;left:64px;bottom:54px;font:700 30px/1.2 "Microsoft YaHei",sans-serif;letter-spacing:.12em;color:#2B3440;background:rgba(232,230,223,.92);padding:14px 20px;border-left:8px solid #7C8FA3}
.tag{position:absolute;right:20px;top:950px;width:270px;height:100px;background:#E8E6DF;border:5px solid #2B3440;box-shadow:0 8px 0 rgba(43,52,64,.18);transform:rotate(-4deg);display:flex;align-items:center;justify-content:center;font:800 30px/1 "Microsoft YaHei",sans-serif;letter-spacing:.08em;color:#2B3440}
.tag span{color:#B85C4A;margin-left:8px}
</style></head><body>
<div class="cover">
  <div class="grain"></div>
  <div class="top">
    <div class="kicker">SINOFIELDNOTES · EP.07</div>
    <div class="title">Momo's Afternoon<br><span class="red">Reading</span></div>
    <div class="sub">Momo的午后阅读时间</div>
    <div class="poem">静夜思 · 李白</div>
    <div class="en">A little poem, a little peace.</div>
    <div class="rule"></div>
  </div>
  <div class="sticker"><b>01</b><span>READING</span></div>
  <div class="bottom">MOMO / 午后阅读</div>
</div>
</body></html>
