<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:1080px;height:1920px;overflow:hidden;background:#F3EBDD}
.cover{position:relative;width:1080px;height:1920px;background:url('assets/mascot/dumplings-cover-v1.png') center/cover no-repeat}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(43,52,64,.055) .7px,transparent .7px);background-size:5px 5px;opacity:.45;pointer-events:none}
.top{position:absolute;left:0;top:0;width:1080px;height:650px;background:#F3EBDD;padding:54px 74px 0;box-shadow:0 10px 0 rgba(43,52,64,.08)}
.kicker{font:600 27px/1.2 Georgia,serif;letter-spacing:.18em;color:#7D8F7C}
.title{font:900 96px/1.0 "Microsoft YaHei",sans-serif;letter-spacing:-.04em;color:#2B3440;margin-top:22px}
.title .red{color:#B85C4A}
.sub{font:700 58px/1.15 "Microsoft YaHei",sans-serif;color:#2B3440;margin-top:18px;letter-spacing:.04em}
.en{font:600 23px/1.3 Georgia,serif;letter-spacing:.16em;color:#6B6257;margin-top:14px}
.rule{position:absolute;left:74px;bottom:0;width:932px;height:6px;background:#C9A46A}
.sticker{position:absolute;right:54px;top:735px;width:220px;height:220px;border-radius:50%;background:#B85C4A;color:#FFF9EF;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);box-shadow:0 12px 0 rgba(43,52,64,.18);border:6px solid #F3EBDD}
.sticker b{font:900 82px/0.9 Georgia,serif;letter-spacing:-.05em}
.sticker span{font:700 18px/1.2 Arial,sans-serif;letter-spacing:.1em;margin-top:8px}
.bottom{position:absolute;left:64px;bottom:54px;font:700 30px/1.2 "Microsoft YaHei",sans-serif;letter-spacing:.12em;color:#2B3440;background:rgba(243,235,221,.94);padding:14px 20px;border-left:8px solid #7D8F7C}
</style></head><body>
<div class="cover">
  <div class="grain"></div>
  <div class="top">
    <div class="kicker">SINOFIELDNOTES · EP.09</div>
    <div class="title"><span class="red">5 个词</span>，60 秒</div>
    <div class="sub">包饺子</div>
    <div class="en">MOMO MAKES DUMPLINGS</div>
    <div class="rule"></div>
  </div>
  <div class="sticker"><b>09</b><span>DUMPLING</span></div>
  <div class="bottom">MOMO / 包饺子</div>
</div>
</body></html>
